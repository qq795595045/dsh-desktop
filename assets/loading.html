<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DSH Desktop</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; background: #0f172a; color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .bubble {
      width: 88px; height: 88px; border-radius: 24px; background: #fff;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .dot { width: 14px; height: 14px; border-radius: 50%; background: #0f172a; }
    h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.5px; }
    p { font-size: 13px; color: #94a3b8; }
    .spinner {
      width: 22px; height: 22px; border: 2px solid #334155; border-top-color: #60a5fa;
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <h1>DSH Desktop</h1>
  <p>正在启动 DeepSeek Harness 服务…</p>
  <div class="spinner"></div>
</body>
</html>
