name: release

# 打 tag(v*)即自动构建并发布 GitHub Release,供应用内自动更新使用。
# 推荐发版流程(本地只需两行):
#   npm version patch && git push --follow-tags
# 之后 CI 自动完成构建 + 上传 + 生成 latest-mac.yml。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14          # Apple Silicon (arm64),与本地产物一致
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 未签名(当前状态)。macOS 上自动更新会退化为「手动下载」。
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

          # ── 有 Apple Developer ID 证书后,取消下面注释并配置仓库 Secrets ──
          # CSC_LINK: ${{ secrets.CSC_LINK }}                       # .p12 证书(base64)
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}       # 证书密码
          # APPLE_ID: ${{ secrets.APPLE_ID }}                       # Apple 账号
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}             # Team ID
        run: |
          # 启用签名 + 公证后,把下面改为:
          #   npx electron-builder --mac --publish always -c.mac.notarize.teamId="$APPLE_TEAM_ID"
          npx electron-builder --mac --publish always

      - name: Upload zip as extra artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-mac
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
          if-no-files-found: ignore
